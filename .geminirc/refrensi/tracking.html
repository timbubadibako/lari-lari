<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARI - Tracking HUD (Midnight Sapphire)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background: #020617; color: #f1f5f9; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(30px); border: 1px solid rgba(56, 189, 248, 0.1); }
        .screen { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; border: 10px solid #1e293b; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8); margin: 0 auto; }
        .map-bg { position: absolute; inset: 0; background: url('https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/12/2144/1454.png'); background-size: cover; filter: brightness(0.2) saturate(0.5); }
    </style>
</head>
<body class="p-12">
    <div class="screen bg-black">
        <div class="map-bg"></div>
        
        <div class="absolute inset-0 flex flex-col p-8 z-10">
            <!-- Secondary Stats -->
            <div class="flex justify-between mt-12">
                <div>
                    <p class="text-[10px] uppercase tracking-widest text-slate-500">Avg Pace</p>
                    <p class="text-3xl font-serif italic text-sky-400">5'24"</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] uppercase tracking-widest text-slate-500">Heart Rate</p>
                    <p class="text-3xl font-serif italic">148 <span class="text-[10px] font-sans not-italic text-slate-500 uppercase">BPM</span></p>
                </div>
            </div>

            <!-- Main Metric -->
            <div class="flex-1 flex flex-col justify-center items-center">
                <p class="text-xs uppercase tracking-[0.4em] text-slate-600 mb-4">Distance Elapsed (KM)</p>
                <h1 class="text-9xl font-serif italic font-bold tracking-tighter">14.2</h1>
                <div class="w-16 h-0.5 bg-sky-500/20 mt-10 rounded-full"></div>
            </div>

            <!-- Bottom HUD -->
            <div class="mb-6 space-y-8">
                <div class="flex justify-center">
                    <div class="glass px-8 py-3 rounded-full flex items-center gap-4 border border-white/5">
                        <span class="text-[10px] uppercase tracking-widest text-slate-500">Time</span>
                        <span class="text-xl font-medium font-mono tabular-nums">00:54:12</span>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button class="flex-1 glass py-5 rounded-full font-medium uppercase text-xs tracking-widest border border-white/5">Hold to Pause</button>
                    <button class="w-20 h-20 bg-sky-500 rounded-full flex items-center justify-center shadow-lg shadow-sky-500/20 active:scale-95 transition-transform">
                        <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
