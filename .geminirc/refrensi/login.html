<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARI - Elite Entry (Midnight Sapphire)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background: #010413; color: #f1f5f9; overflow: hidden; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .glass-deep { background: rgba(2, 6, 23, 0.4); backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(56, 189, 248, 0.1); }
        .input-luxe { background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid rgba(56, 189, 248, 0.2); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-luxe:focus { border-bottom-color: #38bdf8; background: rgba(56, 189, 248, 0.05); outline: none; padding-left: 1.5rem; }
        .bg-glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 70%); border-radius: 50%; filter: blur(80px); }
        .scan-line { position: absolute; height: 1px; width: 100%; background: linear-gradient(to right, transparent, rgba(56, 189, 248, 0.5), transparent); animation: scan 3s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .btn-luxe { position: relative; overflow: hidden; transition: all 0.3s; }
        .btn-luxe::after { content: ''; position: absolute; inset: 0; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent); transform: translateX(-100%); transition: 0.6s; }
        .btn-luxe:hover::after { transform: translateX(100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-end p-8 relative">
    
    <!-- Immersive Background -->
    <div class="bg-glow -top-40 -left-40"></div>
    <div class="bg-glow -bottom-40 -right-40 opacity-50"></div>
    <div class="absolute inset-0 opacity-20 pointer-events-none">
        <div class="scan-line"></div>
    </div>

    <!-- Mobile Screen Wrapper -->
    <div class="w-full max-w-sm relative z-10 flex flex-col h-full justify-between pb-10">
        
        <!-- Top Hero Section -->
        <div class="mt-20 text-center animate-in fade-in slide-in-from-top-10 duration-1000">
            <h1 class="text-7xl font-serif italic text-white tracking-tighter mb-1">LARI</h1>
            <div class="h-0.5 w-12 bg-sky-500 mx-auto rounded-full mb-4"></div>
            <p class="text-[10px] uppercase tracking-[0.5em] text-sky-500 font-bold">Zenith Protocol Activated</p>
        </div>

        <!-- Auth Form -->
        <div class="glass-deep rounded-[3.5rem] p-8 pb-12 animate-in fade-in slide-in-from-bottom-20 duration-1000">
            <div class="flex gap-6 mb-10 border-b border-white/5 pb-4">
                <button class="text-sm uppercase tracking-widest font-bold text-white border-b-2 border-sky-500 pb-2">Login</button>
                <button class="text-sm uppercase tracking-widest font-bold text-slate-500 hover:text-slate-300 transition-colors">Register</button>
            </div>

            <div class="space-y-8 mb-10">
                <div class="relative group">
                    <label class="absolute -top-6 left-0 text-[9px] uppercase tracking-widest text-sky-500/60 group-focus-within:text-sky-400">Tactical Identity</label>
                    <input type="text" placeholder="OPERATIVE ID" class="w-full input-luxe py-4 text-sm tracking-widest text-white placeholder:text-slate-700">
                </div>
                <div class="relative group">
                    <label class="absolute -top-6 left-0 text-[9px] uppercase tracking-widest text-sky-500/60 group-focus-within:text-sky-400">Access Cipher</label>
                    <input type="password" placeholder="••••••••" class="w-full input-luxe py-4 text-sm tracking-widest text-white placeholder:text-slate-700">
                </div>
            </div>

            <button class="btn-luxe w-full bg-sky-500 text-slate-900 font-bold py-5 rounded-[2rem] shadow-[0_20px_40px_rgba(14,165,233,0.2)] text-sm uppercase tracking-widest active:scale-95">
                Authorize Access
            </button>

            <!-- Biometric / Social -->
            <div class="mt-10 flex items-center justify-center gap-8 border-t border-white/5 pt-8">
                <button class="w-12 h-12 rounded-full glass-deep flex items-center justify-center hover:border-sky-500/50 transition-all active:scale-90">
                    <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0112 3v0c4.705 0 8.683 3.228 9.731 7.5a10.003 10.003 0 01-1.162 9.616m-1.438-1.54l-.114-.13" stroke-width="1.5" stroke-linecap="round"></path></svg>
                </button>
                <button class="w-12 h-12 rounded-full glass-deep flex items-center justify-center hover:border-sky-500/50 transition-all active:scale-90">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.808 4.056-1.144 1.144-2.936 2.456-6.032 2.456-4.848 0-8.672-3.92-8.672-8.712s3.824-8.712 8.672-8.712c2.616 0 4.544 1.032 5.96 2.36l2.304-2.304C18.664 1.056 15.912 0 12.48 0 5.616 0 0 5.616 0 12.48S5.616 24.96 12.48 24.96c3.704 0 6.512-1.216 8.712-3.52 2.272-2.272 2.992-5.464 2.992-8.032 0-.776-.064-1.52-.184-2.24H12.48z"></path></svg>
                </button>
                <button class="w-12 h-12 rounded-full glass-deep flex items-center justify-center hover:border-sky-500/50 transition-all active:scale-90">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-3.13 1.57-1.13 0-2.34-.49-3.04-1.26-.75-.8-1.15-1.93-1.15-3.01 0-1.1 0-2.26 1.13-3.02C9.725-.01 11.145-.51 12.285-.51c1.15 0 2.35.51 3.04 1.25.75.8 1.04 1.93 1.04 3.02zM18.791 12.85c-1.48 1.41-3.6 2.4-5.45 2.4-1.53 0-3.56-.81-4.93-2.33-1.28-1.48-1.81-3.19-1.81-4.72 0-3.06 2.12-5.23 4.94-5.23 1.42 0 3.2.78 4.43 2.02l.03.03c.12.12.24.27.39.39.09.09.18.21.3.3.35.4.6.56.91.56.24 0 .56-.11.83-.34 1.16-1.02 2.59-1.89 3.96-1.89 2.5 0 4.5 1.95 4.5 4.39 0 2.19-1.15 4.55-3.05 6.38l-.01.01z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center animate-in fade-in duration-1000 delay-500">
            <p class="text-[9px] text-slate-600 uppercase tracking-[0.3em]">Neural Link Status: <span class="text-sky-500">Encrypted</span></p>
        </div>
    </div>
</body>
</html>
