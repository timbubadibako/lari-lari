<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARI - Luxury Screen Mockups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background: #050505; color: #f8fafc; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .glass { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .screen { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; border: 10px solid #1a1a1a; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8); }
        .map-bg { position: absolute; inset: 0; background: url('https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/12/2144/1454.png'); background-size: cover; filter: brightness(0.6) contrast(1.2); }
        .glow-emerald { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-12 flex flex-wrap justify-center gap-16">

    <!-- Dashboard Screen -->
    <div>
        <h2 class="text-xs font-semibold uppercase tracking-[0.3em] mb-6 text-center text-slate-500">I / Executive Dashboard</h2>
        <div class="screen">
            <div class="map-bg"></div>
            
            <!-- Top Bar -->
            <div class="absolute top-14 left-6 right-6 flex justify-between items-center z-10">
                <div class="glass px-4 py-2 rounded-full border border-white/5 flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center font-serif italic text-sm text-black font-bold">Z</div>
                    <p class="text-[10px] uppercase tracking-widest font-medium">Zenith Phase</p>
                </div>
                <div class="glass w-10 h-10 rounded-full flex items-center justify-center border border-white/5">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                </div>
            </div>

            <!-- Left Status Hub -->
            <div class="absolute left-6 top-1/3 space-y-4 z-10">
                <div class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-emerald-500 border-l-2 border-emerald-500 glow-emerald">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" stroke-width="1.5"></path></svg>
                </div>
                <div class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-width="1.5"></path></svg>
                </div>
                <div class="glass w-12 h-12 rounded-2xl flex items-center justify-center text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-width="1.5"></path></svg>
                </div>
            </div>

            <!-- Tactical Summary -->
            <div class="absolute bottom-32 left-6 right-6 z-10">
                <div class="glass p-6 rounded-[2rem] border border-white/5">
                    <p class="text-[9px] uppercase tracking-[0.3em] text-slate-500 mb-2">Dominion Expansion</p>
                    <div class="flex justify-between items-end">
                        <h3 class="text-3xl font-serif italic">North Ridge</h3>
                        <p class="text-emerald-500 text-sm font-medium">84% Captured</p>
                    </div>
                </div>
            </div>

            <!-- Primary Control -->
            <div class="absolute bottom-10 left-6 right-6 z-10">
                <button class="w-full bg-white text-black py-6 rounded-full font-serif italic text-2xl tracking-tight shadow-[0_20px_40px_rgba(255,255,255,0.1)] transition-transform active:scale-95">
                    Commence Run
                </button>
            </div>
        </div>
    </div>

    <!-- Active Run HUD Screen -->
    <div>
        <h2 class="text-xs font-semibold uppercase tracking-[0.3em] mb-6 text-center text-slate-500">II / Performance HUD</h2>
        <div class="screen bg-neutral-950">
            <div class="map-bg opacity-20"></div>
            
            <div class="absolute inset-0 flex flex-col p-8 z-10">
                <!-- Meta Data -->
                <div class="flex justify-between mt-10">
                    <div>
                        <p class="text-[10px] uppercase tracking-widest text-slate-500">Pace</p>
                        <p class="text-2xl font-serif italic text-emerald-400">4'52"</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] uppercase tracking-widest text-slate-500">Heart Rate</p>
                        <p class="text-2xl font-serif italic">158 <span class="text-xs font-sans not-italic text-slate-500 uppercase tracking-tighter">BPM</span></p>
                    </div>
                </div>

                <!-- Primary Metric -->
                <div class="flex-1 flex flex-col justify-center items-center">
                    <p class="text-xs uppercase tracking-[0.4em] text-slate-600 mb-4">Distance Elapsed (KM)</p>
                    <h1 class="text-9xl font-serif italic font-bold tracking-tighter">12.4</h1>
                    <div class="w-24 h-0.5 bg-emerald-500/30 mt-8 rounded-full"></div>
                </div>

                <!-- Bottom Controls -->
                <div class="mb-6 space-y-8">
                    <div class="flex justify-center">
                        <div class="glass px-8 py-3 rounded-full flex items-center gap-4 border border-white/5">
                            <span class="text-[10px] uppercase tracking-widest text-slate-500">Time</span>
                            <span class="text-xl font-medium font-mono tabular-nums">00:54:12</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <button class="flex-1 glass py-5 rounded-full font-medium uppercase text-sm tracking-widest border border-white/5">Hold to Pause</button>
                        <button class="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/20 active:scale-95 transition-transform">
                            <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
