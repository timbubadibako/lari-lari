<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARI - Tactical Overlays (Midnight Sapphire)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background: #020617; color: #f1f5f9; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .modal-glass { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(40px); border: 1px solid rgba(56, 189, 248, 0.15); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9); }
        .text-sapphire { background: linear-gradient(to bottom, #ffffff 0%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-12 gap-12">

    <!-- Mission Complete Modal -->
    <div class="relative max-w-xl w-full modal-glass rounded-[3rem] p-12 text-center overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-sky-500/40 rounded-b-full"></div>

        <div class="mb-10">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full border border-sky-500/20 flex items-center justify-center">
                <svg class="w-10 h-10 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" stroke-width="1.2"></path></svg>
            </div>
            <h1 class="text-6xl font-serif italic text-sapphire leading-tight">Session Concluded</h1>
            <p class="text-[10px] uppercase tracking-[0.4em] text-slate-500 mt-2">Territory Expansion Confirmed</p>
        </div>

        <div class="grid grid-cols-2 gap-px bg-white/5 rounded-3xl overflow-hidden mb-12">
            <div class="bg-black/40 p-8">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 mb-2">Distance</p>
                <p class="text-4xl font-serif italic">14.2 <span class="text-xs font-sans not-italic text-slate-600">KM</span></p>
            </div>
            <div class="bg-black/40 p-8">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 mb-2">XP Gained</p>
                <p class="text-4xl font-serif italic text-sky-500">+920</p>
            </div>
            <div class="bg-black/40 p-8 border-t border-white/5">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 mb-2">Duration</p>
                <p class="text-4xl font-serif italic">54:12</p>
            </div>
            <div class="bg-black/40 p-8 border-t border-white/5">
                <p class="text-[9px] uppercase tracking-widest text-slate-500 mb-2">New Sector</p>
                <p class="text-4xl font-serif italic">12</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="bg-white text-slate-900 py-5 rounded-full font-medium text-xs uppercase tracking-widest transition-transform hover:scale-[1.02] active:scale-95">
                Accept Rewards
            </button>
            <button class="bg-sky-500/10 text-sky-400 py-5 rounded-full font-medium text-xs uppercase tracking-widest border border-sky-500/20">
                Share Data
            </button>
        </div>
    </div>

    <!-- Notification Overlay (Floating) -->
    <div class="modal-glass p-5 rounded-[2rem] flex items-center gap-6 border-l-4 border-sky-500 animate-bounce">
        <div class="w-12 h-12 bg-sky-500/10 text-sky-500 rounded-full flex items-center justify-center font-serif italic text-xl">14</div>
        <div class="text-left pr-8">
            <p class="text-[9px] uppercase tracking-widest text-sky-500 font-bold mb-1">Level Sync</p>
            <p class="text-sm font-medium">Zenith Vanguard Phase II</p>
        </div>
    </div>

</body>
</html>
