<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LARI - Tactical Dashboard (Midnight Sapphire)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,400;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background: #020617; color: #f1f5f9; }
        .font-serif { font-family: 'Bodoni Moda', serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(56, 189, 248, 0.1); }
        .screen { width: 375px; height: 812px; border-radius: 44px; overflow: hidden; position: relative; border: 10px solid #1e293b; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8); margin: 0 auto; }
        .map-bg { position: absolute; inset: 0; background: url('https://cartodb-basemaps-a.global.ssl.fastly.net/dark_all/12/2144/1454.png'); background-size: cover; filter: brightness(0.4) saturate(0.8); }
        .territory-fill { position: absolute; background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); }
        .sidebar-active { border-right: 2px solid #0ea5e9; background: linear-gradient(to right, rgba(14, 165, 233, 0.1), transparent); }
    </style>
</head>
<body class="p-12">
    <div class="screen">
        <div class="map-bg"></div>
        
        <!-- Mock Territory -->
        <div class="territory-fill" style="top: 300px; left: 100px; width: 120px; height: 150px; clip-path: polygon(0% 0%, 100% 20%, 80% 100%, 20% 80%);"></div>

        <!-- Top Status -->
        <div class="absolute top-14 left-6 right-6 flex justify-between items-start z-10">
            <div class="glass px-4 py-3 rounded-2xl flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-sky-500 flex items-center justify-center font-serif italic text-slate-900 font-bold">Z</div>
                <div>
                    <p class="text-[9px] uppercase tracking-widest text-slate-500">Operative Rank</p>
                    <p class="text-xs font-bold text-sky-400">Zenith Vanguard</p>
                </div>
            </div>
            <button class="glass w-12 h-12 rounded-2xl flex items-center justify-center">
                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" stroke-width="1.5"></path></svg>
            </button>
        </div>

        <!-- Left Vertical Nav -->
        <div class="absolute left-6 top-1/3 space-y-3 z-10">
            <div class="glass w-12 h-12 rounded-xl flex items-center justify-center text-sky-400 sidebar-active">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="1.5"></path></svg>
            </div>
            <div class="glass w-12 h-12 rounded-xl flex items-center justify-center text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="1.5"></path></svg>
            </div>
            <div class="glass w-12 h-12 rounded-xl flex items-center justify-center text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="1.5"></path></svg>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="absolute bottom-10 left-6 right-6 z-10">
            <div class="flex justify-between items-end mb-6">
                <div class="glass p-5 rounded-3xl border-l-2 border-sky-500">
                    <p class="text-[9px] uppercase tracking-widest text-slate-500 mb-1">Dominion Area</p>
                    <p class="text-2xl font-serif italic text-white">42.8 <span class="text-[10px] font-sans not-italic text-slate-500">KM²</span></p>
                </div>
                <button class="w-14 h-14 glass rounded-full flex items-center justify-center text-sky-500 shadow-lg shadow-sky-500/10 active:scale-90 transition-all">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <button class="w-full bg-white text-slate-900 py-6 rounded-full font-serif italic text-2xl tracking-tight shadow-[0_20px_50px_rgba(255,255,255,0.1)] active:scale-95 transition-all">
                Commence Mission
            </button>
        </div>
    </div>
</body>
</html>
